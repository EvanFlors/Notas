name: verify

# Verifica firma + attestations ANTES de desplegar. Pensado para ser
# invocado desde el workflow de deploy via `workflow_call`, pasando el
# digest exacto (NUNCA un tag mutable).
#
# Falla rapido si:
#   - la firma cosign no verifica contra el issuer/identity esperados, o
#   - no existe una attestation SLSA de build-provenance para ese digest.

on:
  workflow_call:
    inputs:
      image:
        description: "Registry + repo (sin tag, sin digest). Ej: ghcr.io/org/app"
        required: true
        type: string
      digest:
        description: "sha256:... del artefacto a verificar"
        required: true
        type: string
      certificate-identity-regexp:
        description: "Regex de la identity Fulcio esperada"
        required: false
        type: string
        default: "^https://github\\.com/[^/]+/[^/]+/\\.github/workflows/release\\.yml@refs/tags/v.*$"
      certificate-oidc-issuer:
        description: "Issuer OIDC esperado"
        required: false
        type: string
        default: "https://token.actions.githubusercontent.com"
  workflow_dispatch:
    inputs:
      image:
        required: true
        type: string
      digest:
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Cosign verify + attestations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # necesario para `gh attestation verify`
      packages: read

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0
        with:
          cosign-release: v2.4.1

      - name: Verify cosign signature (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ inputs.image }}@${{ inputs.digest }}
          IDENTITY_RE: ${{ inputs.certificate-identity-regexp }}
          ISSUER: ${{ inputs.certificate-oidc-issuer }}
        run: |
          cosign verify \
            --certificate-identity-regexp "${IDENTITY_RE}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${IMAGE_REF}"

      - name: Verify SBOM attestation (SPDX)
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ${{ inputs.image }}@${{ inputs.digest }}
          IDENTITY_RE: ${{ inputs.certificate-identity-regexp }}
          ISSUER: ${{ inputs.certificate-oidc-issuer }}
        run: |
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "${IDENTITY_RE}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${IMAGE_REF}"

      - name: Verify SLSA build provenance (gh attestation)
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ inputs.image }}@${{ inputs.digest }}
        run: |
          gh attestation verify \
            "oci://${IMAGE_REF}" \
            --repo "${GITHUB_REPOSITORY}"
