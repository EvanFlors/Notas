{{- /*
Secret dummy para el DATABASE_URL de desarrollo local.
En entornos reales esto DEBE venir de un External Secrets Operator (etapa 12).
No pongas secretos verdaderos en values.yaml.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fastapi-app.fullname" . }}-db
  labels:
    {{- include "fastapi-app.labels" . | nindent 4 }}
  annotations:
    capstone.invalid/managed-by: helm-dev-only
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
