apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fastapi-app.fullname" . }}-test-connection"
  labels:
    {{- include "fastapi-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          echo "Probing {{ include "fastapi-app.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.liveness.path }}"
          wget -qO- "http://{{ include "fastapi-app.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.liveness.path }}"
