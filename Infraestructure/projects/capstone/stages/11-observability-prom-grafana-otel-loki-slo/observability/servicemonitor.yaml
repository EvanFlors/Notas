---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capstone-api
  namespace: observability
  labels:
    # Must match prometheusSpec.serviceMonitorSelector in kps values.
    release: kps
    app.kubernetes.io/name: capstone-api
    app.kubernetes.io/part-of: capstone
spec:
  namespaceSelector:
    matchNames:
      - capstone
  selector:
    matchLabels:
      app.kubernetes.io/name: capstone-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      # Drop high-cardinality labels we don't need in the SLO query.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "go_.*|process_.*"
          action: drop
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: k8s_namespace
