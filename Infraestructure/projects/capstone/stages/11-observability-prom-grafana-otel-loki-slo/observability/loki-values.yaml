---
# Values for grafana/loki chart >= 6.10.0. SingleBinary mode (monolithic),
# more than enough for the capstone volume (<10 req/s).

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h   # 7d
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    max_global_streams_per_user: 5000
    reject_old_samples: true
    reject_old_samples_max_age: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Disable the sub-components so we really run as monolith.
backend: { replicas: 0 }
read:    { replicas: 0 }
write:   { replicas: 0 }

gateway:
  enabled: false   # we talk to the Service directly, no nginx fronting
test:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: true
    labels:
      release: kps
