---
# Values for open-telemetry/opentelemetry-collector >= 0.100.0.
# This single values file is reused for both releases:
#   - otel-agent    (helm --set mode=daemonset): per-node receiver, zero-hop ingest.
#   - otel-gateway  (helm --set mode=deployment): batching, retries, backend fan-out.
# The chart ignores pipelines that reference extensions not enabled for the mode,
# so this file is safe for both.

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.113.0"

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The chart renders mode-specific tolerations/affinities when mode=daemonset.
tolerations:
  - operator: Exists

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    prometheus:
      config:
        scrape_configs:
          - job_name: otel-collector-self
            scrape_interval: 30s
            static_configs:
              - targets: ["127.0.0.1:8888"]

  processors:
    batch:
      send_batch_size: 1024
      timeout: 5s
    memory_limiter:
      check_interval: 2s
      limit_percentage: 80
      spike_limit_percentage: 20
    k8sattributes:
      extract:
        metadata:
          - k8s.pod.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.deployment.name
    resource:
      attributes:
        - key: deployment.environment
          value: capstone
          action: upsert
    # Head-based probabilistic sampling at the gateway only.
    probabilistic_sampler:
      sampling_percentage: 10

  exporters:
    debug:
      verbosity: basic
    otlp/tempo:
      endpoint: tempo.observability.svc:4317
      tls:
        insecure: true
    loki:
      endpoint: http://loki.observability.svc:3100/loki/api/v1/push
    prometheusremotewrite:
      endpoint: http://kps-prometheus.observability.svc:9090/api/v1/write
      tls:
        insecure: true
      # Dummy auth header; replace via ExternalSecrets in stage 12.
      headers:
        X-Scope-OrgID: "dummy-tenant"

  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
    zpages:
      endpoint: 0.0.0.0:55679

  service:
    extensions: [health_check, zpages]
    telemetry:
      logs:
        level: info
      metrics:
        address: 0.0.0.0:8888
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, probabilistic_sampler, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [loki]
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [prometheusremotewrite]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP
