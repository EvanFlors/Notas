# Capstone etapa 3 — configuracion de ruff, mypy y pytest.
# Este archivo sobrescribe (o se mergea con) el pyproject de la etapa 1.
# Mantiene la configuracion fuente-unica: CI y local corren identico.

[project]
name = "capstone-app"
version = "0.3.0"
description = "FastAPI app del capstone — etapa 3 (CI calidad + seguridad)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "diff-cover>=9.0",
  "bandit[sarif]>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
]

# ---------------------------------------------------------------------------
# ruff — lint + format (reemplaza black + isort + flake8).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "build", "dist"]

[tool.ruff.lint]
# Conjunto balanceado: pycodestyle, pyflakes, bugbear, isort, security.
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "S",   # flake8-bandit (overlap controlado con bandit)
  "N",   # pep8-naming
  "C4",  # comprehensions
  "SIM", # simplify
]
ignore = [
  "S101",  # assert en tests esta OK
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — tipado estricto solo en app/; tests se auditan menos duro.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
show_error_codes = true
pretty = true
exclude = ["build/", "dist/", "migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest — descubrimiento, coverage, markers.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "slow: tests que tardan > 1s",
  "integration: requieren servicios externos (DB)",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/__main__.py",
  "app/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
