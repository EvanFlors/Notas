# ClusterSecretStore: cómo autentica ESO contra Vault en modo kubernetes-auth.
# Replace server:port with the IP of your Vault instance reachable from the
# cluster. For `kind` + docker, use the Vault container's IP in the kind net.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-capstone
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-capstone"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
