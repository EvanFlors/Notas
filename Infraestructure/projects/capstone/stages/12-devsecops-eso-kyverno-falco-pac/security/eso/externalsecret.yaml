# ExternalSecret: materializa el Secret `capstone-app` desde kv/capstone/app en
# Vault. refreshInterval 30s = ESO vuelve a leer Vault cada 30s y actualiza el
# Secret si algo cambió. creationPolicy Owner = el Secret pertenece al ES y es
# borrado si el ES desaparece.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: capstone-app
  namespace: capstone
spec:
  refreshInterval: "30s"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-capstone
  target:
    name: capstone-app
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: capstone
          app.kubernetes.io/owner: platform
          app.kubernetes.io/env: dev
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: capstone/app
        property: database_url
    - secretKey: JWT_SIGNING_KEY
      remoteRef:
        key: capstone/app
        property: jwt_signing_key
