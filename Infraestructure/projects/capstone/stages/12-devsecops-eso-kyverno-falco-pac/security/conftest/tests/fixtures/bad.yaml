---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-api
  namespace: capstone
  labels:
    app.kubernetes.io/name: capstone
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: capstone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capstone
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/capstone:latest
          securityContext:
            privileged: true
      volumes:
        - name: root
          hostPath:
            path: /
