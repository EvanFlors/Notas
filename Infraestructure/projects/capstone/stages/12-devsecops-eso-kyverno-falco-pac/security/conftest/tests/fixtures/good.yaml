---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-api
  namespace: capstone
  labels:
    app.kubernetes.io/name: capstone
    app.kubernetes.io/owner: platform
    app.kubernetes.io/env: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: capstone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capstone
        app.kubernetes.io/owner: platform
        app.kubernetes.io/env: dev
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/capstone:v1.0.0
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
