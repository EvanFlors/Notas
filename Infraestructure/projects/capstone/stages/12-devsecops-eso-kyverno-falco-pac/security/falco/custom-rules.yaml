# Falco custom rules para el capstone. Pensadas para arrancar: alta señal,
# ruido bajo. Semantica probada en el curso devsecops/12.
#
# Montar en el chart con:
#   --set-file customRules."custom-rules\\.yaml"=security/falco/custom-rules.yaml
---
- macro: capstone_pod
  condition: >
    container and k8s.ns.name = "capstone"

- rule: Shell spawned in capstone pod
  desc: >
    Un shell interactivo (bash/sh/zsh) fue lanzado dentro de un contenedor
    del namespace capstone. En runtime "healthy" nunca ocurre; es un
    indicador fuerte de kubectl exec no autorizado o de reverse shell.
  condition: >
    spawned_process and capstone_pod
    and proc.name in (bash, sh, zsh, ash, dash)
    and not proc.pname in (python, python3, uvicorn)
  output: >
    Shell spawned in capstone pod
    (user=%user.name container=%container.name image=%container.image.repository
     pod=%k8s.pod.name shell=%proc.name parent=%proc.pname cmdline=%proc.cmdline)
  priority: WARNING
  tags: [container, capstone, mitre_execution, T1059]
  source: syscall

- rule: Read sensitive file untrusted
  desc: >
    Un proceso en cualquier contenedor leyo /etc/shadow, /etc/sudoers o
    claves SSH. Nunca legitimo en una app web; o es malware o es un
    operador curioso. En ambos casos queremos saberlo.
  condition: >
    open_read and container
    and (fd.name in (/etc/shadow, /etc/sudoers)
         or fd.name startswith "/root/.ssh/")
    and not proc.name in (sshd, sudo)
  output: >
    Sensitive file read inside container
    (user=%user.name container=%container.name image=%container.image.repository
     file=%fd.name proc=%proc.name cmdline=%proc.cmdline)
  priority: WARNING
  tags: [container, capstone, mitre_credential_access, T1552]
  source: syscall
