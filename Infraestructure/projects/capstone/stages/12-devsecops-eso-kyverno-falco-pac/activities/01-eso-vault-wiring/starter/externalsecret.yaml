  namespace: capstone
spec:
  refreshInterval: "30s"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-capstone
  target:
    name: capstone-app
    creationPolicy: Owner
  data: [] # TODO: completar con los secretKey + remoteRef (database_url, jwt_signing_key)
