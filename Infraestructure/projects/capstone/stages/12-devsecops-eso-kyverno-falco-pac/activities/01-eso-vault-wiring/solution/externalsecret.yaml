apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: capstone-app
  namespace: capstone
spec:
  refreshInterval: "30s"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-capstone
  target:
    name: capstone-app
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: capstone/app
        property: database_url
    - secretKey: JWT_SIGNING_KEY
      remoteRef:
        key: capstone/app
        property: jwt_signing_key
