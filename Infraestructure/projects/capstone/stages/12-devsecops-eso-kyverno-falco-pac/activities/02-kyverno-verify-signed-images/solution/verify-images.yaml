apiVersion: kyverno.io/v2beta1
kind: ClusterPolicy
metadata:
  name: verify-capstone-images
  annotations:
    policies.kyverno.io/title: Verify cosign keyless signature on capstone images
    policies.kyverno.io/category: Supply Chain Security
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-signature-keyless
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno, external-secrets, falco]
      verifyImages:
        - imageReferences:
            - "ghcr.io/acme/capstone*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/acme/capstone/.github/workflows/release.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
