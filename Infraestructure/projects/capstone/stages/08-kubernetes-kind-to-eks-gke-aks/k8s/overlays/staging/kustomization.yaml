apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-stg

resources:
  - ../../base
  - namespace.yaml

images:
  - name: ghcr.io/example/capstone-api
    newTag: stg-0.1.0

replicas:
  - name: capstone-api
    count: 2

configMapGenerator:
  - name: capstone-api
    behavior: merge
    literals:
      - APP_ENV=staging
      - LOG_LEVEL=info

patches:
  - path: patch-hpa.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: capstone-api
  - path: patch-ingress.yaml
    target:
      kind: Ingress
      name: capstone-api
