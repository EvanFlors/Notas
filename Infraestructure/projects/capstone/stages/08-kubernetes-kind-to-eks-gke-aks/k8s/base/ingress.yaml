apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capstone-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: capstone.local # overlay sobreescribe
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capstone-api
                port:
                  number: 80
