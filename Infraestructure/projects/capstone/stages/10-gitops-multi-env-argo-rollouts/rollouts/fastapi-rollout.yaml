---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fastapi-api
  labels:
    app.kubernetes.io/name: fastapi-api
    app.kubernetes.io/part-of: capstone
    capstone.stage: "10"
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-api
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/fastapi-api:1.0.0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  strategy:
    canary:
      canaryService: fastapi-api-canary
      stableService: fastapi-api-stable
      maxSurge: 25%
      maxUnavailable: 0
      analysis:
        startingStep: 2
        templates:
          - templateName: success-rate
        args:
          - name: service-name
            value: fastapi-api
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      steps:
        - setWeight: 5
        - pause:
            duration: 2m
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause:
            duration: 5m
        - setWeight: 100
