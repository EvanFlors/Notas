---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fastapi-app
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - env: dev
            namespace: dev
            autoSync: true
            pausePromotion: false
            replicas: 1
          - env: staging
            namespace: staging
            autoSync: true
            pausePromotion: false
            replicas: 2
          - env: prod
            namespace: prod
            autoSync: false
            pausePromotion: true
            replicas: 3
  template:
    metadata:
      name: 'fastapi-{{ .env }}'
      labels:
        app.kubernetes.io/part-of: capstone
        capstone.stage: "10"
      annotations:
        argocd-image-updater.argoproj.io/image-list: api=ghcr.io/acme/fastapi-api
        argocd-image-updater.argoproj.io/api.update-strategy: semver
        argocd-image-updater.argoproj.io/api.allow-tags: 'regexp:^[0-9]+\.[0-9]+\.[0-9]+$'
        argocd-image-updater.argoproj.io/write-back-method: git
        argocd-image-updater.argoproj.io/git-branch: 'main'
    spec:
      project: default
      source:
        repoURL: https://github.com/acme/capstone-manifests.git
        targetRevision: main
        path: 'charts/fastapi-api'
        helm:
          valueFiles:
            - 'values.yaml'
            - '../../envs/{{ .env }}/values.yaml'
          parameters:
            - name: replicaCount
              value: '{{ .replicas }}'
            - name: env.name
              value: '{{ .env }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
