apiVersion: v1
kind: Service
metadata:
  name: capstone-stable
spec:
  type: ClusterIP
  selector:
    app: capstone
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-canary
spec:
  type: ClusterIP
  selector:
    app: capstone
  ports:
    - name: http
      port: 80
      targetPort: http
