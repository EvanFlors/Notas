id: argo-03-01-write-application-manifest
title: Escribir un manifiesto Application para el capstone
technology: argocd-gitops
module: 03-application-anatomy-sources-destinations-sync
level: beginner
type: guided-lab

estimated_minutes: 45

prerequisites:
  - argo-02-02-connect-repo-and-sync

objectives:
  - Escribir un Application CR válido con source, destination, syncPolicy e ignoreDifferences
  - Elegir un targetRevision apropiado según el ambiente (branch vs tag vs commit)
  - Añadir ignoreDifferences para /spec/replicas junto con RespectIgnoreDifferences=true
  - Validar el manifiesto client-side (y server-side si hay cluster disponible)

