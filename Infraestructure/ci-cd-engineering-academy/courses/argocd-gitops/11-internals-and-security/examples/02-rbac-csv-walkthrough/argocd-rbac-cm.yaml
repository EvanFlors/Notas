apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  # Deny-by-default: anything not explicitly allowed is denied.
  # Change to 'role:readonly' to make all authenticated users read-only by default.
  policy.default: ""

  # Which JWT claim(s) are matched against `g, <subject>, …` bindings.
  # '[groups]' = only the 'groups' claim. '[groups, email]' allows binding by email too.
  scopes: '[groups, email]'

  policy.csv: |
    # =========================================================================
    # ROLES
    # Format: p, <role>, <resource>, <action>, <object>, <effect>
    #   resource = applications | clusters | repositories | projects | logs |
    #              exec | accounts | gpgkeys | certificates | extensions
    #   action   = get | create | update | delete | sync | override | action/* | *
    #   object   = <project>/<app>  (or <object>/<name>, or *)
    #   effect   = allow | deny     (deny wins over allow on the same match)
    # =========================================================================

    # Global read-only: lets anyone bound here browse the whole Argo CD.
    p, role:readonly, applications, get, */*, allow
    p, role:readonly, projects,     get, *,   allow
    p, role:readonly, clusters,     get, *,   allow
    p, role:readonly, repositories, get, *,   allow
    p, role:readonly, logs,         get, */*, allow

    # Platform admin: everything, everywhere. Keep this list TINY.
    p, role:platform-admin, *, *, */*, allow

    # Team A developers: can view and sync their own apps; cannot delete.
    p, role:team-a-dev, applications, get,    team-a/*, allow
    p, role:team-a-dev, applications, sync,   team-a/*, allow
    p, role:team-a-dev, applications, action/*, team-a/*, allow
    p, role:team-a-dev, logs,         get,    team-a/*, allow
    p, role:team-a-dev, applications, delete, team-a/*, deny

    # Team B developers: mirror of A on their own namespace.
    p, role:team-b-dev, applications, get,    team-b/*, allow
    p, role:team-b-dev, applications, sync,   team-b/*, allow
    p, role:team-b-dev, applications, action/*, team-b/*, allow
    p, role:team-b-dev, logs,         get,    team-b/*, allow
    p, role:team-b-dev, applications, delete, team-b/*, deny

    # =========================================================================
    # BINDINGS
    # Format: g, <subject>, <role>
    #   subject matches a value from one of the configured scopes (groups, email).
    # =========================================================================
    g, platform-sre@acme.com,   role:platform-admin
    g, acme-org:platform,       role:platform-admin
    g, acme-org:team-a,         role:team-a-dev
    g, acme-org:team-b,         role:team-b-dev

    # Anti-pattern (do NOT uncomment in prod): grants god-mode to any role.
    # p, role:*, applications, *, */*, allow
