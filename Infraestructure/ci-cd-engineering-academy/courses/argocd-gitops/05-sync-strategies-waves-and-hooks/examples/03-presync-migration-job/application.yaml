apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: presync-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/example/infra
    path: courses/argocd-gitops/05-sync-strategies-waves-and-hooks/examples/03-presync-migration-job/app
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: presync-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
