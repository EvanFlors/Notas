apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/example/infra
    path: courses/argocd-gitops/05-sync-strategies-waves-and-hooks/examples/01-automated-prune-selfheal/app
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
