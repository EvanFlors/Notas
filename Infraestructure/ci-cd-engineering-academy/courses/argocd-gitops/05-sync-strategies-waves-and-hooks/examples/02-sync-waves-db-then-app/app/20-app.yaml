apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: waves-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: db.waves-demo.svc.cluster.local
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: waves-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
