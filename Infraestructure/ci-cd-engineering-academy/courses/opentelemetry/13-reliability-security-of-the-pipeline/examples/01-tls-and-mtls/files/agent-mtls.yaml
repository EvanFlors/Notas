receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14317
      http:
        endpoint: 0.0.0.0:14318

processors:
  batch:
    send_batch_size: 100
    timeout: 1s

exporters:
  otlp/gateway:
    endpoint: gateway:4317
    tls:
      insecure: false
      ca_file:   /etc/otel/certs/ca.crt
      cert_file: /etc/otel/certs/client.crt
      key_file:  /etc/otel/certs/client.key
      server_name_override: gateway

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/gateway, debug]
