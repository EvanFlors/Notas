receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file:      /etc/otel/certs/server.crt
          key_file:       /etc/otel/certs/server.key
          client_ca_file: /etc/otel/certs/ca.crt
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file:      /etc/otel/certs/server.crt
          key_file:       /etc/otel/certs/server.key
          client_ca_file: /etc/otel/certs/ca.crt

processors:
  batch:
    send_batch_size: 1024
    timeout: 500ms

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
