id: otel-11-01-switch-backend-no-code-change
title: Swap tracing backend from Tempo to Jaeger with zero code change
technology: opentelemetry
module: 11-backends-tempo-jaeger-loki-prometheus-multi
level: advanced
type: guided-lab

estimated_minutes: 70

prerequisites:
