services:
  tempo:
    image: grafana/tempo:2.6.0
    container_name: ex03-tempo
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: ex03-otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # Vendor credentials — provided from host env, NEVER committed.
      DD_API_KEY: "${DD_API_KEY:-fake-key-walkthrough-only}"
      DD_SITE: "${DD_SITE:-datadoghq.com}"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ex03-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro

  trace-gen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.111.0
    container_name: ex03-trace-gen
    command:
      - traces
      - --otlp-endpoint=otel-collector:4317
      - --otlp-insecure
      - --service=trace-gen-fanout
      - --rate=3
      - --duration=24h
    depends_on:
      - otel-collector

volumes:
  tempo-data:
