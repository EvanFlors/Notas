apiVersion: batch/v1
kind: Job
metadata:
  name: telemetrygen-traces
  namespace: demo
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: telemetrygen
    spec:
      restartPolicy: Never
      containers:
        - name: gen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.111.0
          args:
            - traces
            - --otlp-endpoint=enricher-collector.observability:4317
            - --otlp-insecure
            - --traces=20
            - --service=telemetrygen-demo
            - --rate=5
            - --duration=5s
