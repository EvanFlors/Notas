# Starter — Workload Identity Federation for GKE
# Fill in TODOs. Keep project_id as a placeholder (never a real GCP project ID).
# Validate: kubectl apply --dry-run=client -f serviceaccount-and-deployment.yaml

# ---- 1) K8s ServiceAccount annotated for Workload Identity -----------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-app
  namespace: checkout
  annotations:
    # TODO: set the GSA email. Format:
    #   <gsa_name>@<project_id>.iam.gserviceaccount.com
    iam.gke.io/gcp-service-account: checkout-app@my-project-123.iam.gserviceaccount.com

---
# ---- 2) Deployment that uses the K8s SA ------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-app
  namespace: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-app
  template:
    metadata:
      labels:
        app: checkout-app
    spec:
      # TODO: wire the SA.
      serviceAccountName: checkout-app

      # DO NOT mount a service account key JSON. DO NOT set GOOGLE_APPLICATION_CREDENTIALS.
      # DO NOT envFrom a secret containing a GSA key. The pod gets a federated token
      # from the GKE metadata server automatically.

      containers:
        - name: app
          image: europe-west1-docker.pkg.dev/my-project-123/apps/checkout:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: BUCKET
              value: checkout-assets-prod
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
