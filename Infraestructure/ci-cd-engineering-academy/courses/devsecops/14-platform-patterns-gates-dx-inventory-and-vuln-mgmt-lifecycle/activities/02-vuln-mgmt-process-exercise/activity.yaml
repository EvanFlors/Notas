  - Enumerar al menos 5 metricas DevSecOps con formula y SLO
  - Describir un escenario realista aplicando el lifecycle a una CVE nueva (ej. openssl 3.0.x)
  - Nombrar al menos 3 antipatrones y como el proceso los previene

