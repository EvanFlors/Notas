id: sec-14-02-vuln-mgmt-process-exercise
title: Proceso operativo del vuln management lifecycle (SLA tiers, MTTR, dashboard)
technology: devsecops
module: 14-platform-patterns-gates-dx-inventory-and-vuln-mgmt-lifecycle
level: advanced
type: independent

estimated_minutes: 90

prerequisites:
  - sec-05-sca-container-scanning-with-trivy
  - sec-09-signing-and-attestations-with-cosign-sigstore
  - sec-11-k8s-admission-kyverno-and-policy-controller
  - sec-13-secrets-at-scale-vault-eso-and-workload-identity

objectives:
  - Documentar las 6 etapas del lifecycle (detect, triage, prioritize, remediate, verify, report) con owner nombrado por etapa
