apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-dev
spec:
  provider:
    vault:
      # TODO: replace with the Vault URL printed by starter/04-bootstrap-vault.sh
      # Example (do not copy literally — your IP will differ):
      #   http://172.18.0.N:8200
      server: "http://REPLACE_ME:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          # TODO: replace with the Vault role bound to the ESO ServiceAccount
          # (see starter/04-bootstrap-vault.sh output).
          role: "REPLACE_ME"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
