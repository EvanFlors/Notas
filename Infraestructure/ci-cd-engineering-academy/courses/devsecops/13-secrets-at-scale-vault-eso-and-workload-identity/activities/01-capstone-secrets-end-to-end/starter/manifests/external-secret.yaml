apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payments-stripe
  namespace: payments
spec:
  refreshInterval: "30s"
  secretStoreRef:
    kind: ClusterSecretStore
    # TODO: name of the ClusterSecretStore declared in secret-store.yaml
    name: REPLACE_ME
  target:
    # TODO: name of the resulting K8s Secret (must match consumer.yaml)
    name: REPLACE_ME
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_API_KEY
      remoteRef:
        # TODO: Vault path (relative to the kv mount) and the property key
        key: REPLACE_ME_PATH
        property: REPLACE_ME_PROPERTY
