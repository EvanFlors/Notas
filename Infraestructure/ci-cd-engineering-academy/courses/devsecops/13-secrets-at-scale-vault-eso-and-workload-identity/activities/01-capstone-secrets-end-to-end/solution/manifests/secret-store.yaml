apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-dev
spec:
  provider:
    vault:
      # Your Vault IP will differ. Replace with the IP printed by
      # starter/04-bootstrap-vault.sh (Vault's IP on the 'kind' docker network).
      server: "http://172.18.0.42:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-payments"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
