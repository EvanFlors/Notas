---
- name: Ensure app user exists
  ansible.builtin.user:
    name: "{{ common_appuser }}"
    home: "{{ common_appuser_home }}"
    shell: /bin/bash
    state: present
    create_home: true
  become: true

- name: Set system timezone
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ common_timezone }}\n"
    owner: root
    group: root
    mode: "0644"
  become: true
