apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: echoes.demo.academy.io
spec:
  group: demo.academy.io
  names:
    plural: echoes
    singular: echo
    kind: Echo
    shortNames: [ec]
    categories: [all]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 256
            status:
              type: object
              properties:
                observedMessage:
                  type: string
                lastReconciledAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: ["True", "False", "Unknown"] }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Message
          type: string
          jsonPath: .spec.message
        - name: Observed
          type: string
          jsonPath: .status.observedMessage
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
