apiVersion: v1
kind: Pod
metadata:
  name: signed
  namespace: app
  labels: { app: signed }
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: web
      image: localhost:5001/app/web:v1   # Firmada por sign-and-push.sh
      ports: [{ containerPort: 8080 }]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: "25m", memory: "32Mi" }
        limits:   { cpu: "250m", memory: "128Mi" }
      volumeMounts:
        - { name: tmp,   mountPath: /tmp }
        - { name: run,   mountPath: /var/run }
        - { name: cache, mountPath: /var/cache/nginx }
  volumes:
    - { name: tmp,   emptyDir: {} }
    - { name: run,   emptyDir: {} }
    - { name: cache, emptyDir: {} }
