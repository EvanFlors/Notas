# INSEGURO A PROPOSITO. En un namespace con PSA enforce=restricted
# este Pod es rechazado por el apiserver con un mensaje listando cada
# violacion.
apiVersion: v1
kind: Pod
metadata:
  name: insecure
  namespace: app
  labels: { app: insecure }
spec:
  containers:
    - name: bad
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsUser: 0
