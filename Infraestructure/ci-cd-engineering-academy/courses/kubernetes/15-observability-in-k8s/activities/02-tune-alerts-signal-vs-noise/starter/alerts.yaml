apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: capstone-alerts
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
    - name: capstone.rules
      rules:
        # ------------------------------------------------------------------
        # TAG: NOISY — classic anti-pattern. CPU rate > 0.1 for 1m fires
        # constantly on nearly any workload. Will train the on-call to ignore.
        # ------------------------------------------------------------------
        - alert: HighCpuUsage
          expr: rate(container_cpu_usage_seconds_total[1m]) > 0.1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "CPU alta"

        # ------------------------------------------------------------------
        # TAG: NOISY — absurd comparison. `container_memory_usage_bytes > 1`
        # is true for every running container.
        # ------------------------------------------------------------------
        - alert: MemoryUsage
          expr: container_memory_usage_bytes > 1
          for: 1m
          labels:
            severity: warning

        # ------------------------------------------------------------------
        # TAG: NOISY — "there is at least one pod" is not an alertable condition.
        # ------------------------------------------------------------------
        - alert: PodPresent
          expr: count(kube_pod_info) > 0
          for: 30s
          labels:
            severity: info

        # ------------------------------------------------------------------
        # TAG: HEALTHY — kubernetes-mixin standard. KEEP AS-IS.
        # ------------------------------------------------------------------
        - alert: KubePodCrashLooping
          expr: |
            max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod in CrashLoopBackOff"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff for 15m."
            runbook_url: "https://runbooks.example.com/KubePodCrashLooping"

        # ------------------------------------------------------------------
        # TAG: HEALTHY — KEEP.
        # ------------------------------------------------------------------
        - alert: KubeDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas != kube_deployment_status_replicas_available
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Deployment replicas mismatch"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has mismatched replicas for 15m."
            runbook_url: "https://runbooks.example.com/KubeDeploymentReplicasMismatch"

        # ------------------------------------------------------------------
        # TAG: HEALTHY — KEEP.
        # ------------------------------------------------------------------
        - alert: KubeNodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Node not ready"
            description: "Node {{ $labels.node }} has not been Ready for 15m."
            runbook_url: "https://runbooks.example.com/KubeNodeNotReady"

        # ------------------------------------------------------------------
        # TAG: HEALTHY — KEEP.
        # ------------------------------------------------------------------
        - alert: KubeAPIDown
          expr: absent(up{job="apiserver"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes API server is down"
            description: "No apiserver scrape returned up=1 in the last 5m."
            runbook_url: "https://runbooks.example.com/KubeAPIDown"

        # ------------------------------------------------------------------
        # TAG: HEALTHY — KEEP.
        # ------------------------------------------------------------------
        - alert: KubePersistentVolumeFillingUp
          expr: |
            (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) < 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PV filling up (<10% free)"
            description: "PV {{ $labels.persistentvolumeclaim }} has <10% free for 10m."
            runbook_url: "https://runbooks.example.com/KubePersistentVolumeFillingUp"

        # ------------------------------------------------------------------
        # TAG: HEALTHY — KEEP. Alertmanager down is a classic silent killer.
        # ------------------------------------------------------------------
        - alert: AlertmanagerDown
          expr: absent(up{job="alertmanager"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager is down"
            description: "No alertmanager scrape returned up=1 in the last 5m."
            runbook_url: "https://runbooks.example.com/AlertmanagerDown"

        # ------------------------------------------------------------------
        # TAG: HEALTHY — KEEP.
        # ------------------------------------------------------------------
        - alert: PrometheusTargetScrapesFailing
          expr: |
            100 * (sum by (job) (rate(prometheus_target_scrapes_sample_out_of_order_total[5m]))
                   / sum by (job) (rate(prometheus_target_scrapes_sample_duplicate_timestamp_total[5m]) + 1)) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus scrape failures"
            description: "Scrape failures above 1% for job {{ $labels.job }}."
            runbook_url: "https://runbooks.example.com/PrometheusTargetScrapesFailing"
