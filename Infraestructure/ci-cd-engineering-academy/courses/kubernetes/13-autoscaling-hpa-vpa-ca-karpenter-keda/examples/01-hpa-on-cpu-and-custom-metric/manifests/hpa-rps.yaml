# Reference: HPA v2 driven by a custom metric served by Prometheus Adapter.
# Not runnable in kind without the Prometheus + prometheus-adapter stack.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-rps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
