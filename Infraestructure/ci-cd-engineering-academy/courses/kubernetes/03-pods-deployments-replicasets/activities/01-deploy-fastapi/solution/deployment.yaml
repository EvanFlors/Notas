apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-stub
  namespace: k8s-03-01
  labels:
    app: fastapi-stub
    component: web
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fastapi-stub
      component: web
  template:
    metadata:
      labels:
        app: fastapi-stub
        component: web
    spec:
      containers:
        - name: web
          image: nginxdemos/hello:plain-text
          ports:
            - containerPort: 80
