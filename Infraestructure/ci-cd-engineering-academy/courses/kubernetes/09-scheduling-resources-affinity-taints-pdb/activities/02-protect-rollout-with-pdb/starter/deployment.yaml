---
# Starter: tienes el Deployment base. Debes AÑADIR:
#   - podAntiAffinity por topologyKey: kubernetes.io/hostname (required)
#   - un PodDisruptionBudget (archivo aparte: pdb.yaml) con minAvailable: 2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical
  labels:
    app: critical
spec:
  replicas: 3
  selector:
    matchLabels:
      app: critical
  template:
    metadata:
      labels:
        app: critical
    spec:
      # TODO: añade spec.affinity.podAntiAffinity requerido por hostname
      containers:
      - name: app
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "25m"
            memory: "16Mi"
          limits:
            cpu: "25m"
            memory: "16Mi"
