---
apiVersion: v1
kind: Namespace
metadata:
  name: cronjob-lab
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: slow-cleanup
  namespace: cronjob-lab
spec:
  schedule: "*/1 * * * *"
  # Forbid: if the previous Job is still active, skip this run.
  # Good default for idempotent cleanups where "latest" is not special.
  # Alternative: Replace (kill the previous one, start new).
  concurrencyPolicy: Forbid
  # If we can't start within 30s of the slot, treat as missed.
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cleanup
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  echo "[slow-cleanup] start $(date -u) UTC"
                  sleep 90
                  echo "[slow-cleanup] end   $(date -u) UTC"
