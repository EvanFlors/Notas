  - Demostrar que el script sale con exit code != 0 cuando hay CRITICAL
  - Añadir `--ignore-unfixed` y justificar cuándo es correcto usarlo
  - Discutir el trade-off entre bloquear por CVE sin parche vs mantener velocidad de release

