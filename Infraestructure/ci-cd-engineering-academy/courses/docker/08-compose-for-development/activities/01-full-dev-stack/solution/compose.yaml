# SOLUTION — compose.yaml completo con healthchecks y encadenamiento correcto.
services:
  api:
    build: ./app
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/postgres
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health').read()\""
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

  proxy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
