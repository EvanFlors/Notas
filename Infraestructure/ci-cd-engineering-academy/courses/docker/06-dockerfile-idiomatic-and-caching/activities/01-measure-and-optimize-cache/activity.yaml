estimated_minutes: 50

prerequisites:
  - dkr-03-images-dockerfile-basics

objectives:
  - Medir el tiempo de un build frio y uno caliente del mismo Dockerfile
  - Diagnosticar que instruccion invalida la cache de pip install
  - Reescribir el Dockerfile aplicando el orden canonico (lockfile antes del codigo)
  - Lograr rebuild caliente en menos de 5 segundos
  - Verificar con docker history que pip install queda cacheado

