apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-microservice
  title: New Python Microservice (FastAPI)
  description: FastAPI + GHA + Helm chart + catalog entry + TechDocs
  tags: [python, fastapi, golden-path]
spec:
  owner: group:platform-team
  type: service

  parameters:
    - title: Service identity
      required: [name, description, owner]
      properties:
        name:
          title: Service name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,30}$'
          description: lowercase, kebab-case, 3-31 chars
        description:
          title: What does it do?
          type: string
          maxLength: 120
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group]

    - title: Deployment target
      required: [environment, replicas]
      properties:
        environment:
          title: Environment
          type: string
          enum: [dev, staging, prod]
          default: dev
        replicas:
          title: Replicas
          type: integer
          minimum: 1
          maximum: 10
          default: 2

    - title: Options
      properties:
        enableTechDocs:
          title: Include TechDocs?
          type: boolean
          default: true

  steps:
    - id: fetch
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          environment: ${{ parameters.environment }}
          replicas: ${{ parameters.replicas }}

    - id: dropTechDocs
      name: Drop TechDocs if not wanted
      if: ${{ parameters.enableTechDocs == false }}
      action: fs:delete
      input:
        files:
          - docs
          - mkdocs.yml

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: github.com?repo=${{ parameters.name }}&owner=my-org
        description: ${{ parameters.description }}
        defaultBranch: main

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
