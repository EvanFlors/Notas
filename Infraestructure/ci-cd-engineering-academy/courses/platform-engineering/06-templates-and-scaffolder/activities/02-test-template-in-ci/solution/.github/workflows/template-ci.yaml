name: template-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fixture-check:
    name: Fixture up-to-date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cookiecutter
        run: pip install cookiecutter

      - name: Regenerate and diff
        run: bash scripts/regenerate-fixture.sh --check
