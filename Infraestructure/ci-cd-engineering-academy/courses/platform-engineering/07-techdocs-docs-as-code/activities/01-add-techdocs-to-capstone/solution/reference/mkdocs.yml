site_name: Checkout Service
docs_dir: docs

plugins:
  - techdocs-core

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - ADRs:
      - "0001 — Adopt TechDocs": adr/0001-adopt-techdocs.md
  - Runbooks:
      - "Deploy & Rollback": runbook/deploy-and-rollback.md
  - API:
      - Reference: api/reference.md
