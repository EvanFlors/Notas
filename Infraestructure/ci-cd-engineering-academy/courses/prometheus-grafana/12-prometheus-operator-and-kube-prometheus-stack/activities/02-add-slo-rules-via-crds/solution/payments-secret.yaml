# Modelo del Secret. En produccion los valores NO viven en el repo:
# usar External Secrets Operator (ESO), SealedSecrets o SOPS.
---
apiVersion: v1
kind: Secret
metadata:
  name: pd-integration
  namespace: payments
type: Opaque
stringData:
  routingKey: REPLACE_WITH_PD_ROUTING_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook
  namespace: payments
type: Opaque
stringData:
  url: REPLACE_WITH_SLACK_WEBHOOK_URL
