global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'node-static'
    static_configs:
      - targets: ['node:9100']
        labels:
          env: demo
          source: static

  - job_name: 'node-file'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.json
        refresh_interval: 30s
