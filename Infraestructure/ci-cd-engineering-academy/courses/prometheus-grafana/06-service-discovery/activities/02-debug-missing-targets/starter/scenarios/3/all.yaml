# Scenario 3: "no veo ningún __meta_* para pods"
# BUG a encontrar: el role del SD es equivocado (service) para un pod suelto.
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prom-s3, namespace: obs-s3 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prom-s3 }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prom-s1 }
subjects:
  - { kind: ServiceAccount, name: prom-s3, namespace: obs-s3 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prom-s3-config, namespace: obs-s3 }
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: 'k8s-pods'
        kubernetes_sd_configs:
          - role: service       # FIX esperado: role: pod (no hay Service para este pod)
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prom-s3, namespace: obs-s3 }
spec:
  replicas: 1
  selector: { matchLabels: { app: prom-s3 } }
  template:
    metadata: { labels: { app: prom-s3 } }
    spec:
      serviceAccountName: prom-s3
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ containerPort: 9090 }]
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes:
        - { name: config, configMap: { name: prom-s3-config } }
---
apiVersion: v1
kind: Service
metadata: { name: prom-s3, namespace: obs-s3 }
spec:
  selector: { app: prom-s3 }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: app-s3, namespace: obs-s3 }
spec:
  replicas: 1
  selector: { matchLabels: { app: app-s3 } }
  template:
    metadata:
      labels: { app: app-s3 }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          ports: [{ name: metrics, containerPort: 9100 }]
