# Scenario 1: "ya está anotado y aún así nada"
# BUG a encontrar: la anotación está en el lugar equivocado del manifest.
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prom-s1, namespace: obs-s1 }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prom-s1 }
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prom-s1 }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prom-s1 }
subjects:
  - { kind: ServiceAccount, name: prom-s1, namespace: obs-s1 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prom-s1-config, namespace: obs-s1 }
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: 'k8s-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prom-s1
  namespace: obs-s1
spec:
  replicas: 1
  selector: { matchLabels: { app: prom-s1 } }
  template:
    metadata: { labels: { app: prom-s1 } }
    spec:
      serviceAccountName: prom-s1
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ containerPort: 9090 }]
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }]
      volumes:
        - { name: config, configMap: { name: prom-s1-config } }
---
apiVersion: v1
kind: Service
metadata: { name: prom-s1, namespace: obs-s1 }
spec:
  selector: { app: prom-s1 }
  ports: [{ port: 9090, targetPort: 9090 }]
---
# App "rota": anotación en Deployment.metadata (Prometheus mira el pod, no el Deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-s1
  namespace: obs-s1
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
spec:
  replicas: 1
  selector: { matchLabels: { app: app-s1 } }
  template:
    metadata:
      labels: { app: app-s1 }
      # FIX esperado: mover las annotations prometheus.io/* aquí.
    spec:
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          ports: [{ name: metrics, containerPort: 9100 }]
