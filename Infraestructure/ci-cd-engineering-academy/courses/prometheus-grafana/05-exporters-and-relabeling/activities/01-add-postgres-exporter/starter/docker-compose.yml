services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: obs0501-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle

  postgres:
    image: postgres:16-alpine
    container_name: obs0501-postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo_user
      # Dummy password for local-only compose network. Do NOT reuse in real envs.
      POSTGRES_PASSWORD: demo_pw_change_me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

