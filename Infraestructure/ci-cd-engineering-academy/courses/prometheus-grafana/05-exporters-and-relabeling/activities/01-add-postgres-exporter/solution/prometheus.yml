global:
  scrape_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
    relabel_configs:
      # Stable, friendly instance name instead of the container hostname.
      - target_label: instance
        replacement: pg-main
      # Platform-wide conventional labels.
      - target_label: env
        replacement: lab
      - target_label: team
        replacement: data
    metric_relabel_configs:
      # Drop system databases from pg_stat_database_*; they do not represent user traffic
      # and add constant 3-datname multiplier to the cardinality of this family.
      - source_labels: [__name__, datname]
        regex: 'pg_stat_database_.*;(template0|template1|postgres)'
        action: drop
