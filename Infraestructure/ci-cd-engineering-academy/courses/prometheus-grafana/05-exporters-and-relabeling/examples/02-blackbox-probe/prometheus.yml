global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://prometheus.io
          - https://grafana.com
          - https://example.com
    relabel_configs:
      # 1) Carry the target URL into the ?target= query param expected by blackbox.
      - source_labels: [__address__]
        target_label: __param_target
      # 2) Keep a human-readable instance label so Grafana shows the URL, not the exporter host.
      - source_labels: [__param_target]
        target_label: instance
      # 3) Redirect the actual scrape to the blackbox exporter.
      - target_label: __address__
        replacement: blackbox-exporter:9115
