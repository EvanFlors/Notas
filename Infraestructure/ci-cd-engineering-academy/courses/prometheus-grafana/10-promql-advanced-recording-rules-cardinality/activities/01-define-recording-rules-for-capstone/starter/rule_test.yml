rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # 1 req/s total durante 10m
      - series: 'http_requests_total{job="api", status="200"}'
        values: '0 60 120 180 240 300 360 420 480 540'
      # 0.05 err/s (5% error rate)
      - series: 'http_requests_total{job="api", status="500"}'
        values: '0 3  6   9   12  15  18  21  24  27'

      # Classic histogram buckets for latency
      - series: 'http_request_duration_seconds_bucket{job="api", le="0.1"}'
        values: '0 60 120 180 240 300 360 420 480 540'
      - series: 'http_request_duration_seconds_bucket{job="api", le="0.5"}'
        values: '0 60 120 180 240 300 360 420 480 540'
      - series: 'http_request_duration_seconds_bucket{job="api", le="1.0"}'
        values: '0 60 120 180 240 300 360 420 480 540'
      - series: 'http_request_duration_seconds_bucket{job="api", le="+Inf"}'
        values: '0 60 120 180 240 300 360 420 480 540'

    promql_expr_test:
      - expr: job:http_requests:rate5m
        eval_time: 5m
        exp_samples:
          - labels: 'job:http_requests:rate5m{job="api"}'
            value: 1

      - expr: job:http_errors:ratio5m
        eval_time: 5m
        exp_samples:
          - labels: 'job:http_errors:ratio5m{job="api"}'
            value: 0.05

      - expr: job:http_request_duration:p99_5m
        eval_time: 5m
        exp_samples:
          - labels: 'job:http_request_duration:p99_5m{job="api"}'
            value: 0.1
