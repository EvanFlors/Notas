---
# SLO availability ingredients for the `payments` service.
#
# Convention:
#   good  = requests with code !~ "5.." (success and client errors but not server errors).
#   total = all scraped requests for the service.
#
# Note: PromQL regex is RE2 and does NOT support lookaheads. We keep the match
# classes simple (`5..`, `.*`) so the rules compile on vanilla Prometheus.
groups:
  - name: slo-ingredients-payments-availability
    interval: 30s
    rules:
      - record: sli:payments_requests:ratio_rate5m
        expr: |
          1 - (
            sum(rate(http_requests_total{job="payments",code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="payments"}[5m]))
          )

      - record: sli:payments_requests:ratio_rate30m
        expr: |
          1 - (
            sum(rate(http_requests_total{job="payments",code=~"5.."}[30m]))
            /
            sum(rate(http_requests_total{job="payments"}[30m]))
          )

      - record: sli:payments_requests:ratio_rate1h
        expr: |
          1 - (
            sum(rate(http_requests_total{job="payments",code=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{job="payments"}[1h]))
          )

      - record: sli:payments_requests:ratio_rate2h
        expr: |
          1 - (
            sum(rate(http_requests_total{job="payments",code=~"5.."}[2h]))
            /
            sum(rate(http_requests_total{job="payments"}[2h]))
          )

      - record: sli:payments_requests:ratio_rate6h
        expr: |
          1 - (
            sum(rate(http_requests_total{job="payments",code=~"5.."}[6h]))
            /
            sum(rate(http_requests_total{job="payments"}[6h]))
          )

      - record: sli:payments_requests:ratio_rate1d
        expr: |
          1 - (
            sum(rate(http_requests_total{job="payments",code=~"5.."}[1d]))
            /
            sum(rate(http_requests_total{job="payments"}[1d]))
          )

      - record: sli:payments_requests:ratio_rate3d
        expr: |
          1 - (
            sum(rate(http_requests_total{job="payments",code=~"5.."}[3d]))
            /
            sum(rate(http_requests_total{job="payments"}[3d]))
          )

      - record: slo:payments_availability:objective
        expr: vector(0.999)

      - record: slo:payments_availability:error_budget
        expr: 1 - slo:payments_availability:objective
