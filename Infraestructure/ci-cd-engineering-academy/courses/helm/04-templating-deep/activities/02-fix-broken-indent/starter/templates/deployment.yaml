apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    {{- template "app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: app
          {{- with .Values.image }}
          image: "{{ .repository }}:{{ .tag }}"
          env:
            - name: APP_ENV
              value: {{ $.Values.env | quote }}
            - name: APP_RELEASE
              value: {{ .Release.Name | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | indent 10 }}
