apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    {{- include "app.labels" . | nindent 4 }}      # FIX #1: template -> include para poder pipear.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: app
          {{- with .Values.image }}
          image: "{{ .repository }}:{{ .tag }}"
          env:
            - name: APP_ENV
              value: {{ $.Values.env | quote }}
            - name: APP_RELEASE
              value: {{ $.Release.Name | quote }}        # FIX #2: dentro de `with`, . == .Values.image; usar $ para root.
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }} # FIX #3: nindent (anade newline) y 12 espacios para alinear bajo resources:.
