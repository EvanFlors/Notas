apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "migration-hook-demo.fullname" . }}
  labels:
    {{- include "migration-hook-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "migration-hook-demo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "migration-hook-demo.labels" . | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/sh", "-c", "echo 'app running after migration'; sleep 3600"]
