# Lives at: ACME/.github/.github/workflows/security-scan.yml
# Called by consumers as:
#   uses: ACME/.github/.github/workflows/security-scan.yml@v1
name: security-scan

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      fail-on-severity:
        type: string
        default: "medium"

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install bandit
        run: pip install --no-cache-dir "bandit[toml]==1.7.9"

      - name: Run bandit (SAST)
        run: |
          bandit -r . \
            --severity-level ${{ inputs.fail-on-severity }} \
            --format screen \
            --exit-zero=false
