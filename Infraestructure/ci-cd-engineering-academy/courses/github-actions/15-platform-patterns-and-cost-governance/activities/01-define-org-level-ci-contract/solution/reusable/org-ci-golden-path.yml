name: org-ci-golden-path

on:
  workflow_call:
    inputs:
      language:
        type: string
        default: "python"
      python-version:
        type: string
        default: "3.12"
      node-version:
        type: string
        default: "20"

permissions:
  contents: read
  security-events: write

concurrency:
  group: org-ci-golden-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        if: inputs.language == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Setup Node
        if: inputs.language == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install + lint + test (Python)
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit ruff
          ruff check .
          bandit -r . -ll
          pytest -q || true

      - name: Install + lint + test (Node)
        if: inputs.language == 'node'
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present

      - name: Summary
        if: always()
        run: |
          echo "## Golden path CI summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- language: ${{ inputs.language }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- runner: ubuntu-latest (x1 multiplier)" >> "$GITHUB_STEP_SUMMARY"
