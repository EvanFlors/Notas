name: CI (safe paths filter)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "src=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -E '^src/' | grep -vE '\.md$' | grep -q .; then
            echo "src=true"  >> "$GITHUB_OUTPUT"
          else
            echo "src=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Report success if no src changes
        if: needs.changes.outputs.src != 'true'
        run: |
          echo "No src changes; reporting success without running tests."
          exit 0
      - uses: actions/checkout@v4
        if: needs.changes.outputs.src == 'true'
      - name: Run tests
        if: needs.changes.outputs.src == 'true'
        run: echo "running tests"
