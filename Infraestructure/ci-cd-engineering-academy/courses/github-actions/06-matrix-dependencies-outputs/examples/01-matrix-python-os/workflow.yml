name: ex-01-matrix-python-os
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }}${{ matrix.experimental && ' [exp]' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
        exclude:
          # Hypothetical: python 3.11 unsupported by a dependency on macOS.
          - os: macos-latest
            python: '3.11'
        include:
          # Extra combo: 3.13 on Ubuntu, marked experimental.
          - os: ubuntu-latest
            python: '3.13'
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Show runtime
        run: |
          python --version
          echo "os=${{ matrix.os }} python=${{ matrix.python }} exp=${{ matrix.experimental }}"
      - name: Run tests
        continue-on-error: ${{ matrix.experimental == true }}
        run: python -c "print('tests OK on ${{ matrix.os }} / ${{ matrix.python }}')"
