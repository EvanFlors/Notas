# .github/workflows/ci-release.yml
# Least-privilege GITHUB_TOKEN pattern.
# Top-level denies everything; each job declares the minimum scopes it needs.

name: ci-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}

# Deny by default. Each job escalates explicitly.
permissions: {}

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------- test: hereda permissions: {} ----------
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # necesario para checkout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.0.0
        with: { python-version: '3.12' }
      - run: pip install -e .[test] && pytest -q

  # ---------- comment-on-pr: solo escribe comentarios ----------
  comment-on-pr:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # para postear el comentario
    steps:
      - name: Post status comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Tests passed on $GITHUB_SHA"

  # ---------- release: solo en tags ----------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: production    # approval + env-scoped secrets
    permissions:
      contents: write          # para crear release y subir assets
      id-token: write          # para OIDC (sigstore, cloud provider)
      attestations: write      # para actions/attest-build-provenance (gha-14)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Build artifact
        run: |
          mkdir -p dist
          echo "payload" > "dist/app-${GITHUB_REF_NAME}.tar.gz"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "dist/app-${TAG}.tar.gz" --generate-notes
