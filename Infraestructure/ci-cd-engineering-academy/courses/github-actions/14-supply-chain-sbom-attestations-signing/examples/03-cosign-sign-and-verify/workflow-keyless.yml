# .github/workflows/sign.yml
# Firma keyless con cosign (OIDC del runner) + verificación en el mismo workflow.
name: sign

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions: {}

jobs:
  sign-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write     # imprescindible para cosign keyless
    env:
      IMAGE: ghcr.io/${{ github.repository }}/app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - uses: sigstore/cosign-installer@d7d6e113b16d7d6f54e9c0ff52a95f31f3cce3b7  # v3.9.1

      - name: Sign image (keyless)
        env:
          IMG: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMG"

      - name: Self-verify (sanity check)
        env:
          IMG: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          IDENTITY_REGEX: ^https://github\.com/${{ github.repository }}/\.github/workflows/sign\.yml@refs/tags/v.*$
        run: |
          cosign verify "$IMG" \
            --certificate-identity-regexp "$IDENTITY_REGEX" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --output=json | jq -r '.[0].optional.Subject // "unknown"'
