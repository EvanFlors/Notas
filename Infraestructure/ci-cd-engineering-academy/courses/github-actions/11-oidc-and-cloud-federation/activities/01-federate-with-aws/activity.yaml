id: gha-11-01-federate-with-aws
title: Federate GitHub Actions with AWS via OIDC (dual-mode)
technology: github-actions
module: 11-oidc-and-cloud-federation
level: advanced
type: guided-lab

estimated_minutes: 75

prerequisites:
  - gha-05-secrets-variables-and-environments-basics
  - gha-09-environments-approvals-and-deployment-protection

objectives:
  - Escribir un workflow de GitHub Actions que asume un rol en AWS vía OIDC con cero secretos de larga vida
