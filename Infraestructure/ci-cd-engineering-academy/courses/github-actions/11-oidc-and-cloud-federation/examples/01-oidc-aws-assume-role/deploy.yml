# .github/workflows/deploy.yml
# OIDC AssumeRole desde main. CERO secrets de larga vida.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}                       # top-level restrictivo

jobs:
  deploy:
    name: Deploy from main (OIDC)
    runs-on: ubuntu-latest
    permissions:
      id-token: write                 # imprescindible: pide JWT a GitHub
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: arn:aws:iam::AWS-ACCOUNT-ID:role/github-deploy
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: eu-west-1

      - name: Who am I?
        run: aws sts get-caller-identity

      # Ejemplo real (comentado):
