# Perímetro VPC Service Controls que envuelve los projects productivos
# con datos regulados. Adoptar primero en dry-run mode (status->useExplicitDryRunSpec).
# Los project numbers y el access policy ID son PLACEHOLDERS.
name: accessPolicies/<ACCESS-POLICY-ID-PLACEHOLDER>/servicePerimeters/prod_data_perimeter
title: prod_data_perimeter
description: Protege los projects productivos regulados de exfiltracion via APIs de Google.
status:
  resources:
    - projects/<project-number-of-checkout-prod>
    - projects/<project-number-of-analytics-prod>
  restrictedServices:
    - storage.googleapis.com
    - bigquery.googleapis.com
    - cloudkms.googleapis.com
    - secretmanager.googleapis.com
  accessLevels:
    - accessPolicies/<ACCESS-POLICY-ID-PLACEHOLDER>/accessLevels/corp_network
  vpcAccessibleServices:
    enableRestriction: true
    allowedServices:
      - RESTRICTED-SERVICES
  ingressPolicies: []
  egressPolicies: []
