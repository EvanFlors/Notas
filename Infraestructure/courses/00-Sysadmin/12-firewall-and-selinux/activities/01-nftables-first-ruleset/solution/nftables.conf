#!/usr/sbin/nft -f
#
# sys-12-01 — Solución de referencia.
# Default-deny inbound: SSH restringido a 10.0.0.0/24, HTTPS abierto a todo origen.

flush ruleset

table inet filter {

    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback.
        iif "lo" accept

        # Conntrack.
        ct state established,related accept
        ct state invalid drop

        # ICMP útil (IPv4).
        ip protocol icmp icmp type {
            echo-request,
            destination-unreachable,
            time-exceeded,
            parameter-problem
        } accept

        # ICMPv6 (NDP, PMTUD): no romper IPv6.
        ip6 nexthdr icmpv6 accept

        # SSH sólo desde la subred administrativa.
        tcp dport 22 ip saddr 10.0.0.0/24 accept

        # HTTPS público.
        tcp dport 443 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
