#!/usr/sbin/nft -f
#
# Ejemplo sys-12: ruleset nftables mínima default-deny inbound.
# Pensada para una VM de laboratorio. No es una política lista para producción
# sin revisar los puertos expuestos.

flush ruleset

table inet filter {

    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback: imprescindible.
        iif "lo" accept

        # Conntrack: aceptar respuestas a conexiones salientes y lo ya establecido.
        ct state established,related accept
        ct state invalid drop

        # ICMP útil para diagnóstico (IPv4).
        ip protocol icmp icmp type {
            echo-request,
            destination-unreachable,
            time-exceeded,
            parameter-problem
        } accept

        # ICMPv6 completo: NDP, PMTUD, etc. Dropearlo rompe IPv6 silenciosamente.
        ip6 nexthdr icmpv6 accept

        # Servicios expuestos. Añade los tuyos aquí.
        tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
