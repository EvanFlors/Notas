apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data-restored
  namespace: k8s08-pg
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  dataSource:
    name: pg-snap
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
