apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector: { matchLabels: { app: demo-app } }
  template:
    metadata:
      labels: { app: demo-app }
      annotations:
        # Operator injects the Python SDK init container & env vars when it sees this.
        instrumentation.opentelemetry.io/inject-python: "python-auto"
    spec:
      containers:
        - name: app
          image: ghcr.io/open-telemetry/opentelemetry-demo:latest-frontendproxy
          # Replace with your own instrumented image; this is a placeholder.
          env:
            - name: OTEL_SERVICE_NAME
              value: demo-app
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  selector: { app: demo-app }
  ports: [{ port: 8000, targetPort: 8000 }]
