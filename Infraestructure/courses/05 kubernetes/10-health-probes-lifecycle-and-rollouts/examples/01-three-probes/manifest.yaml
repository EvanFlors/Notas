---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-probes-demo
  labels: { app: three-probes-demo }
spec:
  replicas: 2
  selector:
    matchLabels: { app: three-probes-demo }
  template:
    metadata:
      labels: { app: three-probes-demo }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests: { cpu: "20m",  memory: "32Mi" }
            limits:   { cpu: "200m", memory: "64Mi" }
          # 1) startupProbe cubre el arranque. Hasta que pasa, las otras dos están suspendidas.
          startupProbe:
            httpGet:
              path: /
              port: http
            # Ventana de arranque total = failureThreshold * periodSeconds = 30 * 2 = 60 s
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          # 2) readinessProbe decide pertenencia al Service. Si falla NO mata — solo saca el Pod.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          # 3) livenessProbe reinicia el contenedor. Debe ser barata y tolerante.
          #    periodSeconds alto + failureThreshold alto = evitamos restarts por hipos.
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: three-probes-demo
spec:
  selector: { app: three-probes-demo }
  ports:
    - port: 80
      targetPort: http
      name: http
