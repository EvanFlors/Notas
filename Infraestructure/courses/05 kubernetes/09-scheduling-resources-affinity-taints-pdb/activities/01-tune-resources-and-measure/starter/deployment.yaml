---
# Starter: Deployment "api" sin requests ni limits.
# Tu trabajo: completarlo para que termine en QoS=Guaranteed con valores razonables.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: app
        image: registry.k8s.io/pause:3.9
        # TODO: declara resources.requests y resources.limits.
        # Reglas que el validador comprueba:
        #   - requests.cpu == limits.cpu (ambos presentes)
        #   - requests.memory == limits.memory (ambos presentes)
        #   - requests.cpu >= 50m   y requests.cpu <= 500m
        #   - requests.memory >= 32Mi y requests.memory <= 256Mi
        # Resultado esperado: status.qosClass == "Guaranteed"
