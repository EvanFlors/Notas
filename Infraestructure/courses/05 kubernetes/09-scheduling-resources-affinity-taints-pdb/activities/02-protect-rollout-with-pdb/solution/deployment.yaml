---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: critical
  labels:
    app: critical
spec:
  replicas: 3
  selector:
    matchLabels:
      app: critical
  template:
    metadata:
      labels:
        app: critical
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: critical
            topologyKey: kubernetes.io/hostname
      containers:
      - name: app
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "25m"
            memory: "16Mi"
          limits:
            cpu: "25m"
            memory: "16Mi"
