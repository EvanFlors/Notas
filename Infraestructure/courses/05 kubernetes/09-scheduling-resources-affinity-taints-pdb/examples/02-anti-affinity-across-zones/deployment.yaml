apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app: payments
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      affinity:
        podAntiAffinity:
          # Duro: no se pueden co-ubicar dos payments en la MISMA zona.
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: payments
            topologyKey: topology.kubernetes.io/zone
      containers:
      - name: app
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
