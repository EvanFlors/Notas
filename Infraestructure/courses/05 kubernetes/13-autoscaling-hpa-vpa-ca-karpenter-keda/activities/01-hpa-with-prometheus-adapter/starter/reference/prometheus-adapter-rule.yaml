# Reference-only: the kind of rule you would set in the prometheus-adapter
# ConfigMap to expose http_requests_per_second as a Pod-scoped custom metric
# that HPA can target with `type: Pods`.
#
# Prerequisites (NOT installed by this activity):
#   - kube-prometheus-stack (Prometheus Operator + Prometheus + Grafana)
#   - prometheus-adapter Helm chart
#   - Your Deployment exposing `http_requests_total` counter on /metrics
rules:
  - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
    resources:
      overrides:
        namespace: {resource: "namespace"}
        pod: {resource: "pod"}
    name:
      matches: "^(.*)_total$"
      as: "${1}_per_second"
    metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'
