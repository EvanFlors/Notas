# Custom Falco rule: shell spawned inside a container of the 'app' namespace.
# Falco built-in list `shell_binaries` cubre sh/bash/zsh/ash/dash/csh/tcsh/ksh.
customRules:
  shell_in_app_namespace.yaml: |-
    - macro: app_namespace
      condition: (k8s.ns.name = "app")

    - rule: Shell spawned in prod container
      desc: >
        Detect any shell execution inside a container running in the 'app'
        namespace. Shells inside prod containers suele indicar debugging ad-hoc
        o actividad post-explotacion.
      condition: >
        spawned_process
        and container
        and shell_procs
        and app_namespace
        and not proc.pname in (sh, bash)
      output: >
        Shell spawned in prod container
        (user=%user.name user_uid=%user.uid container=%container.id
        image=%container.image.repository cmd=%proc.cmdline
        pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: WARNING
      tags: [k8s, shell, custom]
