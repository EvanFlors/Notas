# Imagen que matchea "localhost:5001/app/*" pero no se firmo nunca.
# Kyverno 'verifyImages' debe rechazarla en admission.
apiVersion: v1
kind: Pod
metadata:
  name: unsigned
  namespace: app
  labels: { app: unsigned }
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: fake
      image: localhost:5001/app/unsigned-image:v1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
