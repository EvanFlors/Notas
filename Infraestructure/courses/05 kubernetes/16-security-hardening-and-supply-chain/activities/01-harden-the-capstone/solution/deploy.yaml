apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: app
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080, name: http }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
          volumeMounts:
            - { name: tmp,   mountPath: /tmp }
            - { name: run,   mountPath: /var/run }
            - { name: cache, mountPath: /var/cache/nginx }
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 5
      volumes:
        - { name: tmp,   emptyDir: {} }
        - { name: run,   emptyDir: {} }
        - { name: cache, emptyDir: {} }
