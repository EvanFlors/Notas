# .github/dependabot.yml — copiar a la raíz del repo real.
# Documentación: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # ---------- Python ----------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Dev deps juntos para que no bloqueen reviews
      dev-dependencies:
        dependency-type: "development"
      # Prod: solo minor + patch en el mismo PR; major queda suelto para review
      prod-minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # ---------- GitHub Actions ----------
  # Actualiza las `uses: foo/bar@vX` de tus workflows.
  # Si pinneas por SHA (recomendado), Dependabot sabe actualizar la SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  # ---------- Docker ----------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
