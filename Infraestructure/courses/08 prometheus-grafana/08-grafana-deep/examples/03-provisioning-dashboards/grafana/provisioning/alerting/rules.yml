apiVersion: 1
groups:
  - orgId: 1
    name: platform
    folder: Platform
    interval: 1m
    rules:
      - uid: instance-down
        title: InstanceDown
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.job }}/{{ $labels.instance }} ha estado DOWN >2m."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prom-main
            model:
              refId: A
              expr: up
              instant: true
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
contactPoints:
  - orgId: 1
    name: console-webhook
    receivers:
      - uid: console-webhook
        type: webhook
        settings:
          url: http://localhost:9999/noop
          httpMethod: POST
policies:
  - orgId: 1
    receiver: console-webhook
    group_by: [grafana_folder, alertname]
