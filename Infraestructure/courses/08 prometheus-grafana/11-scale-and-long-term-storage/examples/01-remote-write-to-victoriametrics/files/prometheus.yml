global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local-demo
    replica: a

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    queue_config:
      capacity: 10000
      max_shards: 30
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s
    write_relabel_configs:
      # Drop noisy defaults that rarely add value to the long-term store.
      - source_labels: [__name__]
        regex: '(go_|process_).*'
        action: drop
