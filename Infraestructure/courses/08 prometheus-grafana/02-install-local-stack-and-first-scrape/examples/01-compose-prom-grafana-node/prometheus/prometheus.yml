global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: obs-02-example-01

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: "local"
