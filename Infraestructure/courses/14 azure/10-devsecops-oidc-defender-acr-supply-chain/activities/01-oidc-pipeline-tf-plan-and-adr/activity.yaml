objectives:
  - Disenar la base DevSecOps del tenant (app registration + federated credential + ACR Premium + Defender for Containers) justificando decisiones en un ADR
  - Escribir Terraform plan-only sintacticamente valido (azuread_application_federated_identity_credential, azurerm_container_registry, azurerm_security_center_subscription_pricing)
  - Pinnear el subject claim del federated credential a repo:owner/repo:ref:refs/heads/main (sin wildcards sobre repo)
  - Elegir SKU de ACR razonada (Basic vs Standard vs Premium) para dos workloads
  - Producir ADR-DEVSECOPS-SUPPLY-CHAIN.md con las 6 secciones estandar y referencia explicita a OIDC, ACR, Defender y cosign

