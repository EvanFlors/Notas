# Reference solution: port of hello.yml (GHA) to GitLab CI/CD.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - lint
  - test
  - build

default:
  tags: [saas-linux-small-amd64]

lint-shell:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck scripts/*.sh || true

pytest:
  stage: test
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - pytest -q

build-tarball:
  stage: build
  script:
    - mkdir -p dist
    - tar -czf dist/app.tgz .
  artifacts:
    paths:
      - dist/app.tgz
    expire_in: 1 week
