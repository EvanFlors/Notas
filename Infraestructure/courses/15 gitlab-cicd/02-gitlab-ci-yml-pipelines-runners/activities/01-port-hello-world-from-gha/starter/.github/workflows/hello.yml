# GitHub Actions workflow — origen a portar a GitLab.
name: hello

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh || true

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    container: python:3.12
    steps:
      - uses: actions/checkout@v4
      - name: install deps
        run: pip install -r requirements.txt
      - name: pytest
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: tar
        run: |
          mkdir -p dist
          tar -czf dist/app.tgz .
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/app.tgz
