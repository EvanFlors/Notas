id: gl-04-01-port-matrix-from-gha
title: Portar una matriz de tests de GitHub Actions a GitLab parallel matrix
technology: gitlab-cicd
module: 04-rules-workflow-needs-dag-parallel-matrix
level: intermediate
type: guided-lab

estimated_minutes: 75

prerequisites:
  - gl-02-gitlab-ci-yml-pipelines-runners

objectives:
  - Portar un strategy.matrix de GHA (2x3 con include y exclude) a parallel matrix de GitLab manteniendo todas las combinaciones validas
  - Expresar la exclusion de GHA como entradas separadas en parallel matrix (no simular con rules)
  - Anadir una regla workflow top-level que evite pipelines duplicados en MR
  - Reescribir un rules por job equivalente al if de GHA sobre refs y paths
  - Validar el .gitlab-ci.yml con python yaml y una suite estructural que compruebe parallel matrix workflow y rules

paths:
  instructions: README.md
  starter: starter/
  tests: tests/
  solution: solution/

validation:
  type: structural
  command: "bash tests/validate.sh /tmp/gl-04-01"

status: not-started
