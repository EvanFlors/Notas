# SOLUTION — correccion minima: healthcheck en db + depends_on condition.
services:
  api:
    build: ./app
    ports:
      - "8010:8000"
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/postgres
      RETRY_ON_STARTUP: "0"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
