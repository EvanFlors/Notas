# .github/workflows/sbom.yml
# Build + SBOM (CycloneDX + SPDX) + upload as artifact.
name: sbom

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  build-and-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Build image (load into local docker, do not push)
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          file: Dockerfile.sample
          load: true
          tags: localhost/app:ci

      - name: Install syft
        uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0  # v0.18.0

      - name: Generate SBOM in CycloneDX JSON
        run: syft -o cyclonedx-json=sbom.cdx.json docker:localhost/app:ci

      - name: Generate SBOM in SPDX JSON
        run: syft -o spdx-json=sbom.spdx.json docker:localhost/app:ci

      - name: Summarize SBOM
        run: |
          echo "## SBOM summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- CycloneDX components: $(jq '.components | length' sbom.cdx.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SPDX packages:        $(jq '.packages | length' sbom.spdx.json)"   >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOMs as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sboms
          path: sbom.*.json
          retention-days: 30
