# .github/workflows/release.yml
# Build + push to GHCR + SLSA build provenance + SBOM attestation (ambas Sigstore keyless).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push a GHCR
      id-token: write        # Sigstore keyless OIDC
      attestations: write    # subir attestation al repo
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository }}/app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          file: Dockerfile.sample
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0  # v0.18.0

      - name: Generate SBOM (CycloneDX JSON)
        run: syft -o cyclonedx-json=sbom.cdx.json "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2  # v2.2.3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b  # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Document verification command
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Verificación por el consumidor

          \`\`\`bash
          gh attestation verify oci://${IMAGE}:${{ github.ref_name }} --repo ${{ github.repository }}
          \`\`\`
          EOF
