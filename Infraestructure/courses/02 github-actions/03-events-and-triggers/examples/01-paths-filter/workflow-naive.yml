name: CI (naive paths filter)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/**/*.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "running tests"
