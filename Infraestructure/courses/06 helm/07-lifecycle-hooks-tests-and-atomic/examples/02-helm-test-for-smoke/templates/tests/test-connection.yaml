apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "smoke-test-demo.fullname" . }}-test-connection"
  labels:
    {{- include "smoke-test-demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: {{ .Values.test.image | quote }}
      command: ["wget"]
      args:
        - "--spider"
        - "--timeout={{ .Values.test.timeoutSeconds }}"
        - "http://{{ include "smoke-test-demo.fullname" . }}:{{ .Values.service.port }}/"
