apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# `all.yaml` is written by the post-renderer wrapper from Helm's stdout.
resources:
  - all.yaml

# A corporate-wide label — the kind of thing you want injected into every
# upstream chart's output.
labels:
  - pairs:
      corp.example.com/managed: "true"
    includeSelectors: false

patches:
  - path: patch.yaml
    target:
      kind: Deployment
      name: my-chart
