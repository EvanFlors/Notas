apiVersion: v2
name: parent
description: Parent chart that imports values from the backend subchart.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: backend
    version: 0.1.0
    repository: ""
    import-values:
      # child-parent explicit mapping: backend.service -> parent.backendService
      - child: service
        parent: backendService
      # implicit mapping via `exports.endpoints` on the subchart
      - endpoints
