---
name: role-ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ansible-lint + yamllint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install linters
        run: pip install ansible-core ansible-lint yamllint
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint

  molecule:
    name: molecule (${{ matrix.distro }} / ansible-core ${{ matrix.ansible-core }})
    needs: lint
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - geerlingguy/docker-ubuntu2204-ansible:latest
          - geerlingguy/docker-debian12-ansible:latest
          - geerlingguy/docker-rockylinux9-ansible:latest
        ansible-core:
          - '2.16.*'
          - '2.17.*'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          pip install "ansible-core==${{ matrix.ansible-core }}" \
            molecule 'molecule-plugins[docker]' docker
      - name: Cache collections
        uses: actions/cache@v4
        with:
          path: ~/.ansible/collections
          key: collections-${{ hashFiles('**/requirements.yml') }}
      - name: Run molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
        run: molecule test

  publish:
    name: publish to Galaxy (on tag)
    needs: molecule
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ansible
        run: pip install ansible-core
      - name: Import role to Galaxy
        run: |
          ansible-galaxy role import \
            --api-key "${{ secrets.GALAXY_API_KEY }}" \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}"
