---
- name: Selective tasks via tags
  hosts: local
  gather_facts: false

  tasks:
    - name: Pre-flight check (always runs)
      ansible.builtin.debug:
        msg: "Starting ans-02 tags demo"
      tags: [always]

    - name: Simulate 'install' step
      ansible.builtin.file:
        path: /tmp/ans02-tags/install.marker
        state: touch
        mode: "0644"
      tags: [install]

    - name: Simulate 'config' step
      ansible.builtin.copy:
        dest: /tmp/ans02-tags/app.conf
        content: "env=dev\n"
        mode: "0644"
      tags: [config]

    - name: Simulate 'service' step
      ansible.builtin.file:
        path: /tmp/ans02-tags/service.marker
        state: touch
        mode: "0644"
      tags: [service]

  pre_tasks:
    - name: Ensure demo dir exists
      ansible.builtin.file:
        path: /tmp/ans02-tags
        state: directory
        mode: "0755"
      tags: [always]
