---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-api
  namespace: capstone-dev
spec:
  # This value is what Argo CD "sees" in Git. The HPA will overwrite it live.
  replicas: 3
  selector:
    matchLabels: { app: capstone-api }
  template:
    metadata:
      labels: { app: capstone-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/capstone-api:v1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: capstone-api
  namespace: capstone-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: capstone-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
