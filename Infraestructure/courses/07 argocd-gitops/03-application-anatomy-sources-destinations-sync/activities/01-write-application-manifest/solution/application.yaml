apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone-api-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/acme/capstone-infra.git
    path: envs/dev/api
    targetRevision: main

  destination:
    server: https://kubernetes.default.svc
    namespace: capstone-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: capstone-api
      jsonPointers:
        - /spec/replicas
