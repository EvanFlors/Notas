apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/infra
    path: envs/dev/web
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: web-dev
