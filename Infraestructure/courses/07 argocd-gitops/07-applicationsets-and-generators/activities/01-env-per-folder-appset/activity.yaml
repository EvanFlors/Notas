id: argo-07-01-env-per-folder-appset
title: ApplicationSet con Git generator por carpeta
technology: argocd-gitops
module: 07-applicationsets-and-generators
level: intermediate
type: guided-lab

estimated_minutes: 75

prerequisites:
  - argo-04-01-deploy-capstone-via-helm-source
