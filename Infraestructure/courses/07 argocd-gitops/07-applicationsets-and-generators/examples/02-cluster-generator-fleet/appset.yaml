apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleet-prometheus
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            env: prod
          matchExpressions:
            - key: name
              operator: NotIn
              values: [in-cluster]
  template:
    metadata:
      name: 'prom-{{.name}}'
      labels:
        generated-by: fleet
    spec:
      project: platform
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 65.3.1
        helm:
          releaseName: prom
          valuesObject:
            grafana:
              enabled: false
            prometheus:
              prometheusSpec:
                externalLabels:
                  cluster: '{{.name}}'
      destination:
        server: '{{.server}}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
