apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: capstone
  labels:
    app: capstone
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: capstone
  template:
    metadata:
      labels:
        app: capstone
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: nginx:1.25
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
  strategy:
    canary:
      canaryService: capstone-canary
      stableService: capstone-stable
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: {}
        - setWeight: 100
