apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: capstone-db
  namespace: capstone
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: capstone-store
    kind: ClusterSecretStore
  target:
    name: capstone-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: prod/capstone/db
        property: username
    - secretKey: password
      remoteRef:
        key: prod/capstone/db
        property: password
