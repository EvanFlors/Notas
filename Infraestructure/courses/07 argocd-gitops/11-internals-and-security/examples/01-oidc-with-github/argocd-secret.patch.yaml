# Reference patch — DO NOT apply this file directly with the placeholder in Git.
# Use the stdin method described in README.md step 2 to avoid committing the secret.
#
# Equivalent effect:
#   kubectl -n argocd patch secret argocd-secret --type merge \
#     -p '{"stringData":{"dex.github.clientSecret":"<THE_SECRET>"}}'
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
type: Opaque
stringData:
  dex.github.clientSecret: REPLACE_WITH_GITHUB_OAUTH_APP_CLIENT_SECRET
