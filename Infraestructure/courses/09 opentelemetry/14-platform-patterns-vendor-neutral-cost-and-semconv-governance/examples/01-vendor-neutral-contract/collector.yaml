# Collector mínimo que implementa el contrato v1.
# Backends: Tempo (traces), Prometheus remote-write (metrics), Loki (logs).
# Zero vendor-specific exporters.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 25
  batch:
    timeout: 5s
    send_batch_size: 1024
  k8sattributes:
    passthrough: false
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.node.name
        - k8s.container.name
  resource:
    attributes:
      - key: deployment.environment
        from_attribute: k8s.namespace.name
        action: insert

exporters:
  otlp/tempo:
    endpoint: tempo.observability.svc:4317
    tls:
      insecure: false
      ca_file: /etc/otel/tls/ca.crt
  prometheusremotewrite:
    endpoint: https://prometheus.observability.svc/api/v1/write
    tls:
      ca_file: /etc/otel/tls/ca.crt
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/loki:
    endpoint: https://loki.observability.svc:3100/otlp
    tls:
      ca_file: /etc/otel/tls/ca.crt

extensions:
  health_check: {}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource, batch]
      exporters: [otlphttp/loki]
  telemetry:
    metrics:
      level: detailed
      address: 0.0.0.0:8888
