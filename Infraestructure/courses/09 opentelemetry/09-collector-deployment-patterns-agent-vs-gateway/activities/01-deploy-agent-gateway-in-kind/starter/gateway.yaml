---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 2s, limit_mib: 400, spike_limit_mib: 100 }
      batch:          { send_batch_size: 8192, timeout: 5s }
    exporters:
      # TODO 1: define exporter 'debug' con verbosity: basic
      debug:
        verbosity: REPLACE_ME
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
    service:
      extensions: [health_check]
      pipelines:
        # TODO 2: cada pipeline debe usar memory_limiter -> batch -> debug
        traces:   { receivers: [otlp], processors: [memory_limiter, batch], exporters: [REPLACE_ME] }
        metrics:  { receivers: [otlp], processors: [memory_limiter, batch], exporters: [REPLACE_ME] }
        logs:     { receivers: [otlp], processors: [memory_limiter, batch], exporters: [REPLACE_ME] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: observability
spec:
  replicas: 2
  selector: { matchLabels: { app: otel-gateway } }
  template:
    metadata: { labels: { app: otel-gateway } }
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.109.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
            - { containerPort: 13133, name: health }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol }
          readinessProbe: { httpGet: { path: /, port: 13133 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /, port: 13133 }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 600Mi }
      volumes:
        - name: config
          configMap: { name: otel-gateway-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: observability
spec:
  selector: { app: otel-gateway }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
