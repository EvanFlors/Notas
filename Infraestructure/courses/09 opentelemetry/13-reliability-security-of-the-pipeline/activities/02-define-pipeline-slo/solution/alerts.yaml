groups:
  - name: otel-pipeline-slo
    interval: 30s
    rules:
      - alert: PipelineFastBurn
        expr: |
          (
            sum(rate(otelcol_exporter_send_failed_spans[1h]))
            /
            sum(rate(otelcol_receiver_accepted_spans[1h]))
          ) > 0.02
        for: 5m
        labels:
          severity: critical
          slo: loss_rate
        annotations:
          summary: "Pipeline OTel: fast burn del error budget"
          description: "Mas del 2% de spans perdidos en la ultima hora."
          runbook: "SLO.md#playbook (PipelineFastBurn)"

      - alert: PipelineSlowBurn
        expr: |
          (
            sum(rate(otelcol_exporter_send_failed_spans[6h]))
            /
            sum(rate(otelcol_receiver_accepted_spans[6h]))
          ) > 0.001
        for: 30m
        labels:
          severity: warning
          slo: loss_rate
        annotations:
          summary: "Pipeline OTel: slow burn del error budget"
          description: "Mas del 0.1% de spans perdidos en las ultimas 6h."
          runbook: "SLO.md#playbook (PipelineSlowBurn)"

      - alert: PipelineQueueSaturated
        expr: |
          max(otelcol_exporter_queue_size / otelcol_exporter_queue_capacity) > 0.8
        for: 10m
        labels:
          severity: warning
          slo: saturation
        annotations:
          summary: "Pipeline OTel: cola de exporter >80% capacidad"
          description: "El backend esta lento o caido; riesgo de perdida inminente si la cola se llena."
          runbook: "SLO.md#playbook (PipelineQueueSaturated)"
