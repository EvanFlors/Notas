id: otel-05-01-migrate-prometheus-client-to-otel
title: Migrate a Flask service from prometheus_client to the OTel Metrics API
technology: opentelemetry
module: 05-metrics-api-and-prometheus-interop
level: intermediate
type: guided-lab

estimated_minutes: 75

prerequisites:
  - otel-04-instrumenting-python-traces
  - obs-07-instrumentation-with-python

objectives:
  - Reemplazar Counter/Histogram de prometheus_client por los equivalentes OTel manteniendo /metrics scrapeable
  - Configurar un MeterProvider con PrometheusMetricReader y temporalidad CUMULATIVE
  - Verificar con un script que /metrics expone las métricas con los nombres esperados por Prometheus
  - Argumentar la decisión de temporalidad en una nota corta (ADR-lite)

paths:
  instructions: README.md
  starter: starter/
  tests: tests/
  solution: solution/

validation:
  type: automated
  command: "bash tests/validate.sh"

status: not-started
