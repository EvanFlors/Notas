apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyapp
  namespace: demo
  labels:
    app.kubernetes.io/name: pyapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyapp
  template:
    metadata:
      labels:
        app: pyapp
        app.kubernetes.io/name: pyapp
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: pyapp
  namespace: demo
spec:
  selector:
    app: pyapp
  ports:
    - port: 8080
      targetPort: 8080
