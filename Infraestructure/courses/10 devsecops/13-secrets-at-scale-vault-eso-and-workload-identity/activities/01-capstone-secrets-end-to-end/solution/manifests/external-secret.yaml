apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payments-stripe
  namespace: payments
spec:
  refreshInterval: "30s"
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-dev
  target:
    name: payments-stripe
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_API_KEY
      remoteRef:
        key: payments/stripe
        property: api_key
