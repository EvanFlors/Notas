# Starter compose.yaml — DELIBERADAMENTE INSEGURO.
# Reescribir en operative/solution/compose.yaml.

services:
  pricing-api:
    build: .
    image: pricing-api:latest
    ports:
      - "80:8000"
    environment:
      DB_URL: "postgresql://postgres:hunter2@db:5432/pricing"
      ADMIN_TOKEN: "admin-super-secret-123"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app
    privileged: true
    depends_on:
      - db

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: hunter2
      POSTGRES_DB: pricing
