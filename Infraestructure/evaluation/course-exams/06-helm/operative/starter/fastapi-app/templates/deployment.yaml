apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastapi-app.fullname" . }}
  labels:
    {{- template "fastapi-app.labels" . | nindent 4 }}   # BUG: `template` no se puede pipear a `nindent`.
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fastapi-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fastapi-app.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"   # BUG: si tag="" renderiza ":" inválido. Usar `default .Chart.AppVersion`.
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{ toYaml .Values.env | nindent 12 }}         # BUG sutil: falta `-` → deja línea vacía con indentación.
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
