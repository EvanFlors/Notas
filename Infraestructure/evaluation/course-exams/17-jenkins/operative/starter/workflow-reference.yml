# Workflow GHA de referencia — payments-api
# El candidato debe portar este workflow a un Jenkinsfile Declarative equivalente.
# No es necesario que el pipeline Jenkins sea literal 1-a-1; sí debe cubrir los mismos
# pasos conceptuales (lint, test, build, publish, deploy) y las mismas políticas de
# seguridad (sin secretos en logs, aprobación manual antes del deploy a prod).

name: payments-api-ci

on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write   # necesario para OIDC federation al cloud

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm test -- --reporters=default --reporters=jest-junit
      - uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml

  build-and-publish:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: registry.corp.internal
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - run: docker build -t registry.corp.internal/payments-api:${{ github.sha }} .
      - run: docker push registry.corp.internal/payments-api:${{ github.sha }}

  deploy:
    needs: build-and-publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production      # requiere aprobación manual
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/payments-deployer
          aws-region: us-east-1
      - run: ./scripts/deploy.sh ${{ github.sha }}
